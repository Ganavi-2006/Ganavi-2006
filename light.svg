<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="Animated GitHub profile hero for S Ganavi">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#0F172A"/><stop offset="1" stop-color="#F1F5F9"/>
    <animate attributeName="x1" values="0;1;0" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;0;1" dur="12s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7C3AED"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#10B981"/>
    <animate attributeName="x1" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;0;1" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="glow"><stop stop-color="#7C3AED" stop-opacity=".30"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  <radialGradient id="cyan"><stop stop-color="#22D3EE" stop-opacity=".18"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
  <clipPath id="card"><rect x="22" y="22" width="1136" height="566" rx="28"/></clipPath>
  <mask id="fade">
    <linearGradient id="maskg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="white"/><stop offset=".95" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
    <rect width="1180" height="610" fill="url(#maskg)"/>
  </mask>
</defs>

<rect width="1180" height="610" rx="28" fill="url(#bg)"/>
<g clip-path="url(#card)">
  <circle cx="210" cy="120" r="220" fill="url(#glow)" filter="url(#blur)">
    <animate attributeName="cx" values="210;290;210" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="500" r="260" fill="url(#cyan)" filter="url(#blur)">
    <animate attributeName="cy" values="500;420;500" dur="11s" repeatCount="indefinite"/>
  </circle>

  <g opacity=".5">
    <circle cx="80" cy="80" r="2" fill="#22D3EE"><animate attributeName="cy" values="80;55;80" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="120" r="2" fill="#7C3AED"><animate attributeName="cy" values="120;145;120" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="540" r="2" fill="#10B981"><animate attributeName="cx" values="1040;1010;1040" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="80" r="1.5" fill="#22D3EE"><animate attributeName="cy" values="80;65;80" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <rect x="22" y="22" width="1136" height="566" rx="28" fill="none" stroke="#0F172A" stroke-opacity=".08"/>
  <rect x="23" y="23" width="1134" height="564" rx="27" fill="none" stroke="url(#accent)" stroke-opacity=".55" stroke-dasharray="80 1100">
    <animate attributeName="stroke-dashoffset" values="0;-1180" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Left ASCII portrait -->
  <g transform="translate(55 78)" font-family="monospace" font-size="14" font-weight="700" fill="url(#accent)">
    <text x="0" y="0" opacity="0"><animate attributeName="opacity" begin=".2s" dur=".5s" to="1" fill="freeze"/>       ███████</text>
    <text x="0" y="20" opacity="0"><animate attributeName="opacity" begin=".5s" dur=".5s" to="1" fill="freeze"/>    ███       ███</text>
    <text x="0" y="40" opacity="0"><animate attributeName="opacity" begin=".8s" dur=".5s" to="1" fill="freeze"/>  ███   ●   ●   ███</text>
    <text x="0" y="60" opacity="0"><animate attributeName="opacity" begin="1.1s" dur=".5s" to="1" fill="freeze"/> ███     ▿     ███</text>
    <text x="0" y="80" opacity="0"><animate attributeName="opacity" begin="1.4s" dur=".5s" to="1" fill="freeze"/> ███   ─────   ███</text>
    <text x="0" y="100" opacity="0"><animate attributeName="opacity" begin="1.7s" dur=".5s" to="1" fill="freeze"/>  ███         ███</text>
    <text x="0" y="120" opacity="0"><animate attributeName="opacity" begin="2s" dur=".5s" to="1" fill="freeze"/>    ███     ███</text>
    <text x="0" y="140" opacity="0"><animate attributeName="opacity" begin="2.3s" dur=".5s" to="1" fill="freeze"/>      ███████</text>
    <text x="0" y="176" fill="#475569" font-size="11" opacity=".8">AI &amp; DATA SCIENCE</text>
    <rect x="-8" y="-22" width="315" height="210" fill="none" stroke="#22D3EE" stroke-opacity=".18">
      <animateTransform attributeName="transform" type="translate" values="0,0;0,3;0,0" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="-8" y="-22" width="315" height="3" fill="#22D3EE" opacity=".18">
      <animate attributeName="y" values="-22;185;-22" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Right terminal -->
  <g filter="url(#shadow)">
    <rect x="385" y="58" width="725" height="485" rx="20" fill="#0F172A" fill-opacity=".92" stroke="#0F172A" stroke-opacity=".08"/>
    <rect x="385" y="58" width="725" height="52" rx="20" fill="#FFFFFF"/>
    <circle cx="415" cy="84" r="6" fill="#7C3AED"/><circle cx="435" cy="84" r="6" fill="#22D3EE"/><circle cx="455" cy="84" r="6" fill="#10B981"/>
    <text x="490" y="90" fill="#475569" font-family="monospace" font-size="13">ganavi@github:~</text>
  </g>

  <g font-family="Inter,Arial,sans-serif">
    <text x="430" y="155" fill="#475569" font-size="18">Hi 👋</text>
    <text x="430" y="202" fill="#0F172A" font-size="34" font-weight="700">I'm S Ganavi</text>
    <rect x="430" y="222" width="4" height="27" rx="2" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="444" y="244" fill="url(#accent)" font-size="22" font-weight="600">AI &amp; Data Science Student</text>

    <g fill="#475569" font-size="15">
      <text x="430" y="292">⌖  India</text>
      <text x="430" y="322">⌘  B.Tech — AI &amp; Data Science</text>
      <text x="430" y="352">▸  Current Focus — Python &amp; practical projects</text>
    </g>

    <text x="430" y="394" fill="#0F172A" font-size="15" font-weight="700">SKILLS</text>

    <g font-size="13" font-weight="600">
      <g><rect x="430" y="410" width="92" height="34" rx="17" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".55"/><text x="455" y="432" fill="#E9D5FF">Python</text></g>
      <g><rect x="532" y="410" width="92" height="34" rx="17" fill="#FFFFFF" stroke="#22D3EE" stroke-opacity=".55"/><text x="556" y="432" fill="#CFFAFE">Pandas</text></g>
      <g><rect x="634" y="410" width="92" height="34" rx="17" fill="#FFFFFF" stroke="#10B981" stroke-opacity=".55"/><text x="658" y="432" fill="#D1FAE5">NumPy</text></g>
      <g><rect x="736" y="410" width="115" height="34" rx="17" fill="#FFFFFF" stroke="#7C3AED" stroke-opacity=".55"/><text x="759" y="432" fill="#E9D5FF">Matplotlib</text></g>
      <g><rect x="861" y="410" width="118" height="34" rx="17" fill="#FFFFFF" stroke="#22D3EE" stroke-opacity=".55"/><text x="884" y="432" fill="#CFFAFE">Git &amp; GitHub</text></g>
      <g><rect x="989" y="410" width="92" height="34" rx="17" fill="#FFFFFF" stroke="#10B981" stroke-opacity=".55"/><text x="1012" y="432" fill="#D1FAE5">ML Basics</text></g>
    </g>

    <text x="430" y="480" fill="#64748B" font-size="13">Learning • Building • Growing</text>

    <g transform="translate(1000 472)">
      <circle cx="0" cy="0" r="24" fill="#FFFFFF" stroke="#0F172A" stroke-opacity=".08"/>
      <text x="-9" y="7" fill="#0F172A" font-size="18">GH</text>
    </g>
  </g>

  <!-- scanline -->
  <rect x="25" y="30" width="1130" height="2" fill="#22D3EE" opacity=".08">
    <animate attributeName="y" values="30;580;30" dur="8s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>